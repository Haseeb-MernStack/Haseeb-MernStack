<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="120" viewBox="0 0 1000 120" role="img" aria-label="Tech stack marquee">
  <defs>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e75b6"/><stop offset="1" stop-color="#00c896"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.88" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="m"><rect width="1000" height="120" fill="url(#fade)"/></mask>
  </defs>
  <style>
    text{font-family:'JetBrains Mono',Consolas,Menlo,monospace;font-size:15px;font-weight:700;fill:#e6edf7;text-anchor:middle}
    .chip{fill:#0f1a33;stroke:url(#ac);stroke-width:1.2}
    .row1{animation:left 28s linear infinite}
    .row2{animation:right 32s linear infinite}
    @keyframes left{to{transform:translateX(-1100px)}}
    @keyframes right{from{transform:translateX(-1100px)}to{transform:translateX(0)}}
  </style>
  <rect width="1000" height="120" rx="14" fill="#0b1020"/>
  <g mask="url(#m)">
    <g class="row1">
      <g id="r1">
        <g transform="translate(0 14)"><rect class="chip" width="120" height="40" rx="20"/><text x="60" y="26">React</text></g>
        <g transform="translate(140 14)"><rect class="chip" width="120" height="40" rx="20"/><text x="60" y="26">Next.js</text></g>
        <g transform="translate(280 14)"><rect class="chip" width="140" height="40" rx="20"/><text x="70" y="26">TypeScript</text></g>
        <g transform="translate(440 14)"><rect class="chip" width="140" height="40" rx="20"/><text x="70" y="26">Tailwind</text></g>
        <g transform="translate(600 14)"><rect class="chip" width="120" height="40" rx="20"/><text x="60" y="26">Node.js</text></g>
        <g transform="translate(740 14)"><rect class="chip" width="120" height="40" rx="20"/><text x="60" y="26">Express</text></g>
        <g transform="translate(880 14)"><rect class="chip" width="120" height="40" rx="20"/><text x="60" y="26">MongoDB</text></g>
      </g>
      <use href="#r1" x="1100"/>
      <use href="#r1" x="2200"/>
    </g>
    <g class="row2">
      <g id="r2">
        <g transform="translate(0 66)"><rect class="chip" width="120" height="40" rx="20"/><text x="60" y="26">Redis</text></g>
        <g transform="translate(140 66)"><rect class="chip" width="120" height="40" rx="20"/><text x="60" y="26">Docker</text></g>
        <g transform="translate(280 66)"><rect class="chip" width="100" height="40" rx="20"/><text x="50" y="26">AWS</text></g>
        <g transform="translate(400 66)"><rect class="chip" width="100" height="40" rx="20"/><text x="50" y="26">Jest</text></g>
        <g transform="translate(520 66)"><rect class="chip" width="140" height="40" rx="20"/><text x="70" y="26">GitHub CI</text></g>
        <g transform="translate(680 66)"><rect class="chip" width="120" height="40" rx="20"/><text x="60" y="26">Vercel</text></g>
        <g transform="translate(820 66)"><rect class="chip" width="100" height="40" rx="20"/><text x="50" y="26">MCP</text></g>
      </g>
      <use href="#r2" x="1100"/>
      <use href="#r2" x="2200"/>
    </g>
  </g>
</svg>
