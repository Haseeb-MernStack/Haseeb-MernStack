<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="24" viewBox="0 0 1000 24" role="presentation">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e75b6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00c896"/>
      <stop offset="1" stop-color="#0e75b6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="11" width="1000" height="2" fill="url(#g)" opacity="0.35"/>
  <rect y="10" width="160" height="4" rx="2" fill="url(#g)">
    <animate attributeName="x" values="-160;1000" dur="3.5s" repeatCount="indefinite"/>
  </rect>
  <circle cx="500" cy="12" r="4" fill="#00c896">
    <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
