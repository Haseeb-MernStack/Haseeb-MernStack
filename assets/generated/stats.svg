<svg xmlns="http://www.w3.org/2000/svg" width="495" height="240" viewBox="0 0 495 240" role="img" aria-label="GitHub stats">
<defs>
  <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0e75b6"/><stop offset="1" stop-color="#00c896"/></linearGradient>
  <linearGradient id="fillg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00c896" stop-opacity=".35"/><stop offset="1" stop-color="#0e75b6" stop-opacity="0"/></linearGradient>
  <clipPath id="c"><rect width="495" height="240" rx="14"/></clipPath>
</defs>
<style>
  text{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf7;font-size:13px}
  .m{font-family:'JetBrains Mono',Consolas,Menlo,monospace}
  .h{font-size:16px;font-weight:700;fill:#9fe9d2}
  .dim{fill:#7f98b6}
  .in{animation:in .7s ease backwards}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  
</style>
<g clip-path="url(#c)">
<rect width="495" height="240" fill="#0b1020"/>

  <text class="h" x="28" y="36">GitHub Stats</text>
  
    <g class="in" style="animation-delay:0.15s">
      <text x="28" y="78" class="dim">Total stars</text>
      <text class="m" x="230" y="78" text-anchor="end" style="font-weight:700">28</text>
    </g>
    <g class="in" style="animation-delay:0.25s">
      <text x="28" y="107" class="dim">Commits (last year)</text>
      <text class="m" x="230" y="107" text-anchor="end" style="font-weight:700">202</text>
    </g>
    <g class="in" style="animation-delay:0.35s">
      <text x="28" y="136" class="dim">Pull requests</text>
      <text class="m" x="230" y="136" text-anchor="end" style="font-weight:700">44</text>
    </g>
    <g class="in" style="animation-delay:0.45000000000000007s">
      <text x="28" y="165" class="dim">Issues</text>
      <text class="m" x="230" y="165" text-anchor="end" style="font-weight:700">1</text>
    </g>
    <g class="in" style="animation-delay:0.55s">
      <text x="28" y="194" class="dim">Public repos</text>
      <text class="m" x="230" y="194" text-anchor="end" style="font-weight:700">209</text>
    </g>
    <g class="in" style="animation-delay:0.65s">
      <text x="28" y="223" class="dim">Followers</text>
      <text class="m" x="230" y="223" text-anchor="end" style="font-weight:700">114</text>
    </g>
  <g transform="translate(375 126)">
    <circle r="46" fill="none" stroke="#1d3350" stroke-width="7"/>
    <circle r="46" fill="none" stroke="url(#ac)" stroke-width="7" stroke-linecap="round" transform="rotate(-90)"
      stroke-dasharray="289.0" stroke-dashoffset="0.0">
      <animate attributeName="stroke-dashoffset" from="289.0" to="0.0" dur="1.6s" fill="freeze" calcMode="spline" keySplines=".65 0 .35 1" keyTimes="0;1"/>
    </circle>
    <text class="m" y="4" text-anchor="middle" style="font-size:26px;font-weight:800">17</text>
    <text y="22" text-anchor="middle" class="dim" style="font-size:10px;letter-spacing:1px">DAY STREAK</text>
  </g>
  <text x="375" y="204" text-anchor="middle" class="dim m" style="font-size:10px">longest 17</text>
</g>
<rect x=".5" y=".5" width="494" height="239" rx="14" fill="none" stroke="url(#ac)" stroke-opacity=".55"/>
</svg>
