<svg xmlns="http://www.w3.org/2000/svg" width="720" height="170" viewBox="0 0 720 170" role="img" aria-label="Haseeb-MernStack/commune repository">
<defs>
  <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0e75b6"/><stop offset="1" stop-color="#00c896"/></linearGradient>
  <linearGradient id="fillg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00c896" stop-opacity=".35"/><stop offset="1" stop-color="#0e75b6" stop-opacity="0"/></linearGradient>
  <clipPath id="c"><rect width="720" height="170" rx="14"/></clipPath>
</defs>
<style>
  text{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf7;font-size:13px}
  .m{font-family:'JetBrains Mono',Consolas,Menlo,monospace}
  .h{font-size:16px;font-weight:700;fill:#9fe9d2}
  .dim{fill:#7f98b6}
  .in{animation:in .7s ease backwards}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  
</style>
<g clip-path="url(#c)">
<rect width="720" height="170" fill="#0b1020"/>

  <g class="in">
    <text class="m h" x="28" y="40" style="font-size:20px">Haseeb-MernStack / <tspan style="fill:#00c896">commune</tspan></text>
    <text x="28" y="68" class="dim" style="font-size:14px">Full-stack community platform on MongoDB, Express, React and Node.js, written </text>
    <g transform="translate(28 96)"><rect width="108" height="24" rx="12" fill="#0e75b6" fill-opacity=".18" stroke="#0e75b6" stroke-opacity=".6"/><text class="m" x="54" y="16" text-anchor="middle" style="font-size:11px;fill:#7fe3ff">docker</text></g><g transform="translate(148 96)"><rect width="108" height="24" rx="12" fill="#0e75b6" fill-opacity=".18" stroke="#0e75b6" stroke-opacity=".6"/><text class="m" x="54" y="16" text-anchor="middle" style="font-size:11px;fill:#7fe3ff">mernstack</text></g><g transform="translate(268 96)"><rect width="108" height="24" rx="12" fill="#0e75b6" fill-opacity=".18" stroke="#0e75b6" stroke-opacity=".6"/><text class="m" x="54" y="16" text-anchor="middle" style="font-size:11px;fill:#7fe3ff">nodejs</text></g><g transform="translate(388 96)"><rect width="108" height="24" rx="12" fill="#0e75b6" fill-opacity=".18" stroke="#0e75b6" stroke-opacity=".6"/><text class="m" x="54" y="16" text-anchor="middle" style="font-size:11px;fill:#7fe3ff">open-source</text></g>
    <g transform="translate(28 152)" class="m" style="font-size:12px">
      <circle cx="5" cy="-4" r="5" fill="#3178c6"/><text x="16" y="0">TypeScript</text>
      <text x="150" y="0">★ 5</text>
      <text x="230" y="0">⑂ 4</text>
      <text x="310" y="0" class="dim">MIT</text>
    </g>
  </g>
  <rect y="0" width="90" height="170" fill="#fff" opacity=".04" transform="skewX(-20)"><animate attributeName="x" values="-200;840" dur="6s" repeatCount="indefinite"/></rect>
</g>
<rect x=".5" y=".5" width="719" height="169" rx="14" fill="none" stroke="url(#ac)" stroke-opacity=".55"/>
</svg>
