<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Contribution activity">
<defs>
  <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0e75b6"/><stop offset="1" stop-color="#00c896"/></linearGradient>
  <linearGradient id="fillg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00c896" stop-opacity=".35"/><stop offset="1" stop-color="#0e75b6" stop-opacity="0"/></linearGradient>
  <clipPath id="c"><rect width="1000" height="260" rx="14"/></clipPath>
</defs>
<style>
  text{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf7;font-size:13px}
  .m{font-family:'JetBrains Mono',Consolas,Menlo,monospace}
  .h{font-size:16px;font-weight:700;fill:#9fe9d2}
  .dim{fill:#7f98b6}
  .in{animation:in .7s ease backwards}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  
</style>
<g clip-path="url(#c)">
<rect width="1000" height="260" fill="#0b1020"/>
<text class="h" x="28" y="36">Contribution Activity</text>
  <text class="m dim" x="972" y="36" text-anchor="end" style="font-size:12px">– contributions in the last 60 days</text><text x="500" y="140" text-anchor="middle" class="dim">Waiting for the first workflow run…</text>
</g>
<rect x=".5" y=".5" width="999" height="259" rx="14" fill="none" stroke="url(#ac)" stroke-opacity=".55"/>
</svg>
