<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="Architecture: request flow">
  <defs>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e75b6"/><stop offset="1" stop-color="#00c896"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="c"><rect width="1000" height="360" rx="14"/></clipPath>
  </defs>
  <style>
    text{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf7;font-size:14px;font-weight:600;text-anchor:middle}
    .sub{font-family:'JetBrains Mono',Consolas,Menlo,monospace;font-size:11px;fill:#7f98b6;font-weight:400}
    .node{fill:#0f1a33;stroke:url(#ac);stroke-width:1.4}
    .pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pulse{50%{transform:scale(1.04)}}
    .flow{stroke:#1d3a5a;stroke-width:2;fill:none;stroke-dasharray:6 6;animation:dash 1.2s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-12}}
    .in{opacity:0;animation:in .8s ease forwards}
    @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  </style>
  <g clip-path="url(#c)">
    <rect width="1000" height="360" fill="#0b1020"/>
    <text x="500" y="32" style="font-size:16px;letter-spacing:3px;fill:#9fe9d2">REQUEST LIFECYCLE</text>

    <!-- connectors -->
    <path class="flow" d="M170,180 H250"/>
    <path class="flow" d="M390,180 H450"/>
    <path class="flow" d="M590,160 L650,100"/>
    <path class="flow" d="M590,180 H650"/>
    <path class="flow" d="M590,200 L650,260"/>
    <path class="flow" d="M790,100 H830 V160"/>
    <path class="flow" d="M790,260 H830 V200"/>
    <path class="flow" d="M390,150 L450,100" style="stroke-opacity:.5"/>

    <!-- nodes -->
    <g class="in" style="animation-delay:.2s"><rect class="node" x="30" y="140" width="140" height="80" rx="12"/><text x="100" y="176">Client</text><text class="sub" x="100" y="198">React / Next.js</text></g>
    <g class="in" style="animation-delay:.5s"><rect class="node" x="250" y="140" width="140" height="80" rx="12"/><text x="320" y="176">API Gateway</text><text class="sub" x="320" y="198">Express + Zod</text></g>
    <g class="in" style="animation-delay:.8s"><rect class="node pulse" x="450" y="140" width="140" height="80" rx="12"/><text x="520" y="176">Service Layer</text><text class="sub" x="520" y="198">Business logic</text></g>
    <g class="in" style="animation-delay:1.1s"><rect class="node" x="650" y="70" width="140" height="60" rx="12"/><text x="720" y="97">MongoDB</text><text class="sub" x="720" y="116">Mongoose</text></g>
    <g class="in" style="animation-delay:1.3s"><rect class="node" x="650" y="150" width="140" height="60" rx="12"/><text x="720" y="177">Redis</text><text class="sub" x="720" y="196">Cache</text></g>
    <g class="in" style="animation-delay:1.5s"><rect class="node" x="650" y="230" width="140" height="60" rx="12"/><text x="720" y="257">Jobs</text><text class="sub" x="720" y="276">Background queue</text></g>
    <g class="in" style="animation-delay:1.7s"><rect class="node" x="830" y="140" width="140" height="80" rx="12"/><text x="900" y="176">Observability</text><text class="sub" x="900" y="198">Logs / Metrics</text></g>
    <g class="in" style="animation-delay:1.9s"><rect class="node" x="450" y="58" width="140" height="56" rx="12"/><text x="520" y="84">Auth + RBAC</text><text class="sub" x="520" y="102">JWT</text></g>
    <g class="in" style="animation-delay:2.1s"><rect class="node" x="250" y="290" width="340" height="44" rx="12"/><text x="420" y="317">CI/CD  -  Docker  -  Tests  -  Deploy</text></g>

    <!-- travelling packets -->
    <g filter="url(#glow)">
      <circle r="5" fill="#00c896">
        <animateMotion dur="4s" repeatCount="indefinite" path="M170,180 H250 M250,180 H390 M390,180 H450 M450,180 H590 M590,180 H650"/>
      </circle>
      <circle r="4" fill="#7fe3ff">
        <animateMotion dur="4s" begin="-2s" repeatCount="indefinite" path="M170,180 H590 L650,100"/>
      </circle>
      <circle r="4" fill="#0e75b6">
        <animateMotion dur="5s" begin="-1s" repeatCount="indefinite" path="M170,180 H590 L650,260 H790 H830 V200"/>
      </circle>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="999" height="359" rx="14" fill="none" stroke="url(#ac)" stroke-opacity="0.55"/>
</svg>
